name: Moodle Plugin CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
        moodle-branch: ['MOODLE_405_STABLE']

    steps:
      - name: Check out plugin code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli, pdo_mysql, pgsql, pdo_pgsql, gd, xml, zip, intl, soap
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer global require moodlehq/moodle-plugin-ci:^4
          echo "$HOME/.composer/vendor/bin" >> $GITHUB_PATH
          echo "$HOME/.config/composer/vendor/bin" >> $GITHUB_PATH

      - name: Run moodle-plugin-ci commands
        run: |
          moodle-plugin-ci install --moodle-branch=${{ matrix.moodle-branch }} --db-type=pgsql --db-host=127.0.0.1 --plugin=plugin
          moodle-plugin-ci phplint --plugin=plugin
          moodle-plugin-ci codechecker --plugin=plugin
          moodle-plugin-ci validate --plugin=plugin
          moodle-plugin-ci phpunit --plugin=plugin
