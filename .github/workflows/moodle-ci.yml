name: Moodle Plugin CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
        moodle-branch: ['MOODLE_405_STABLE', 'main']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli, pdo_mysql, gd, xml, zip
          coverage: none

      - name: Run Moodle Plugin CI
        run: |
          composer global require moodlehq/moodle-plugin-ci
          ~/.composer/vendor/bin/moodle-plugin-ci install --moodle-branch=${{ matrix.moodle-branch }} --plugin=plugin
          ~/.composer/vendor/bin/moodle-plugin-ci phplint --plugin=plugin
          ~/.composer/vendor/bin/moodle-plugin-ci codechecker --plugin=plugin
          ~/.composer/vendor/bin/moodle-plugin-ci validate --plugin=plugin
          ~/.composer/vendor/bin/moodle-plugin-ci phpunit --plugin=plugin
