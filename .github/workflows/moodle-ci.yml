name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.experimental == true }}

    services:
      # Per-branch DB versions instead of one floor for the whole matrix: 5.3
      # requires MariaDB >= 11.4.0 and PostgreSQL >= 17 (admin/environment.xml),
      # while 5.1/5.2 require only 10.11.0 / 15 / 16. Pinning everything to 5.3's
      # floor would test the stable branches against versions their sites do not
      # necessarily run, so only the entries that need it override the default.
      mariadb:
        image: mariadb:${{ matrix.mariadb || '10.11' }}
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        # healthcheck.sh ships in both 10.11 and 11.4, so one probe covers every
        # entry. `mysqladmin ping` does not: MariaDB 11 removed the mysql*
        # compatibility symlinks, leaving the container permanently unhealthy and
        # killed before any step runs — which fails every job in the matrix,
        # including the pgsql ones, since services start for all of them.
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3
      postgres:
        image: postgres:${{ matrix.postgres || '16' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        # Moodle 5.1 requires PHP >= 8.2, Moodle 5.2/5.3 require PHP >= 8.3
        # (per each branch's own composer.json), so the pairs are listed
        # explicitly rather than as a full product.
        include:
          - php: '8.2'
            moodle-branch: 'MOODLE_501_STABLE'
            db: 'mariadb'
          - php: '8.2'
            moodle-branch: 'MOODLE_501_STABLE'
            db: 'pgsql'
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
            db: 'mariadb'
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
            db: 'pgsql'
          # Moodle hasn't cut MOODLE_503_STABLE yet, so this tracks core's
          # perpetual dev branch, which currently carries 5.3beta. These are the
          # only entries needing the raised DB floors. Marked experimental (job
          # failure doesn't fail the workflow) since that branch can break
          # independently of this plugin; switch moodle-branch to
          # MOODLE_503_STABLE once it exists and drop `experimental`.
          - php: '8.3'
            moodle-branch: 'main'
            db: 'mariadb'
            mariadb: '11.4'
            experimental: true
          - php: '8.3'
            moodle-branch: 'main'
            db: 'pgsql'
            postgres: '17'
            experimental: true

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli, pdo_mysql, pgsql, pdo_pgsql, gd, xml, zip, intl, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.db }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning
